<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design System — Estado de Excepción</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='80'>🎨</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0e27;
      --card: #1a1f3a;
      --border: #2a3f5f;
      --text: #e4e6eb;
      --muted: #8892b0;
      --secondary: #00d9ff;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 2rem;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: var(--secondary);
      margin-bottom: 1rem;
      font-size: 2rem;
    }
    .status {
      background: rgba(252, 163, 17, 0.1);
      border-left: 4px solid #fca311;
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 2rem;
    }
    .status h2 {
      color: #fca311;
      margin-bottom: 0.5rem;
    }
    .status p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }
    .footer a {
      color: var(--secondary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Design System</h1>
    <div class="status">
      <h2>📋 Próximamente (Fase 3)</h2>
      <p>
        Visor de tokens de diseño: colores, tipografía, espaciado.
        Paleta compartida con fanesca y modo-incognito.
      </p>
    </div>
    <div class="footer">
      <p><a href="../">← Volver a Creador</a></p>
    </div>
  </div>
  <script src="../nav.js"></script>
</body>
</html>
