<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icono PWA de Estado de Excepción.
       Un corredor sobre tres carriles en fuga, con la paleta del juego. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#cielo)"/>

  <!-- Calle en perspectiva -->
  <path d="M 176 512 L 232 232 L 280 232 L 336 512 Z" fill="#12172a"/>

  <!-- Líneas de carril convergiendo en el punto de fuga -->
  <path d="M 214 512 L 246 232 L 254 232 L 238 512 Z" fill="#ffcf3f" opacity="0.85"/>
  <path d="M 298 512 L 266 232 L 258 232 L 274 512 Z" fill="#ffcf3f" opacity="0.85"/>

  <!-- Horizonte -->
  <rect x="120" y="228" width="272" height="4" fill="#ffcf3f" opacity="0.5"/>

  <!-- Corredor: silueta en verde menta -->
  <g fill="#7cffb2">
    <!-- Sombrero -->
    <ellipse cx="256" cy="300" rx="42" ry="9"/>
    <rect x="236" y="276" width="40" height="26" rx="4"/>
    <!-- Cabeza -->
    <rect x="238" y="304" width="36" height="34" rx="6"/>
    <!-- Torso -->
    <rect x="230" y="344" width="52" height="62" rx="8"/>
    <!-- Brazos en carrera -->
    <rect x="200" y="350" width="26" height="16" rx="8" transform="rotate(-24 213 358)"/>
    <rect x="286" y="356" width="26" height="16" rx="8" transform="rotate(24 299 364)"/>
    <!-- Piernas en zancada -->
    <rect x="232" y="404" width="18" height="52" rx="8" transform="rotate(-16 241 430)"/>
    <rect x="262" y="404" width="18" height="52" rx="8" transform="rotate(20 271 430)"/>
  </g>

  <!-- Papeles volando tras el corredor -->
  <g fill="#ffcf3f" opacity="0.9">
    <rect x="150" y="330" width="20" height="26" rx="2" transform="rotate(-18 160 343)"/>
    <rect x="120" y="380" width="16" height="21" rx="2" transform="rotate(14 128 390)"/>
    <rect x="348" y="352" width="18" height="23" rx="2" transform="rotate(22 357 363)"/>
  </g>

  <!-- Franja de peligro inferior: el estado de excepción -->
  <rect x="0" y="472" width="512" height="40" fill="#ff4f6d" opacity="0.28"/>
</svg>
