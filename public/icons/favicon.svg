    <rect x="28" y="53" width="3.5" height="9" rx="1.5" transform="rotate(-16 29.7 57.5)"/>
    <rect x="33" y="53" width="3.5" height="9" rx="1.5" transform="rotate(20 34.7 57.5)"/>
  </g>

