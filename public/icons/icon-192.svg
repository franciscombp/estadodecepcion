    <rect x="88" y="103" width="16" height="11" rx="2"/>
    <rect x="89" y="114" width="14" height="13" rx="3"/>
    <rect x="86" y="129" width="20" height="24" rx="4"/>
    <rect x="88" y="152" width="7" height="20" rx="3" transform="rotate(-16 91 162)"/>
    <rect x="99" y="152" width="7" height="20" rx="3" transform="rotate(20 102 162)"/>
  </g>

