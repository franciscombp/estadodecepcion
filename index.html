<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover + user-scalable=no: pantalla completa en móvil y
       sin zoom accidental al hacer doble tap durante la partida. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- LAS BARRAS NEGRAS DE ARRIBA Y DE ABAJO SON ESTE COLOR.
       Las dibuja el sistema, no la página: en Android es el theme-color el que
       pinta la barra de estado y la de navegación; en iOS es el fondo del
       documento el que se ve por debajo de la barra translúcida. Con el azul
       noche de antes, la aplicación instalada salía con dos franjas casi
       negras enmarcando una página de papel. Papel aquí, papel en el
       manifiesto y papel en html/body: las tres tienen que coincidir o vuelven
       las franjas.

       OJO al actualizar: en Android el theme-color queda GRABADO en el WebAPK
       al instalar. Cambiarlo aquí no repinta las barras de una instalación ya
       hecha hasta que Chrome regenera el WebAPK (lo hace solo, con su ritmo) o
       hasta que se reinstala desde el navegador. -->
  <meta name="theme-color" content="#f3f3f3" />
  <meta name="description"
        content="EL MERCIO presenta: ESTADO DE EXCEPCIÓN. Corre, esquiva y documenta." />

  <!-- Icono de pestaña. Va con ruta relativa para que funcione igual en la
       raíz del dominio que bajo el subdirectorio de GitHub Pages. -->
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <!-- EN PNG. iOS no lee SVG en el apple-touch-icon: sin este archivo, el
       icono de la pantalla de inicio es una captura de la página. -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

  <!-- Permite instalarlo como app en iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- `black-translucent` es lo más cerca que iOS deja de "quitar la barra de
       estado": no se quita —el sistema no lo permite en una web instalada—
       pero se vuelve transparente y la página pasa por debajo. Lo que se ve en
       esa franja es el fondo del documento, y por eso html/body van en papel.
       Requiere viewport-fit=cover, que está arriba. -->
  <!-- `default` Y NO `black-translucent`.
       Con `black-translucent` la página se mete debajo de la barra de estado y
       iOS pinta la hora en BLANCO. Como esta aplicación es un periódico —papel
       gris claro—, el sistema oscurece la franja para que su texto blanco se
       lea encima: de ahí la barra gris que salía arriba, que no la dibujaba la
       página y por eso no había forma de quitarla desde el CSS.
       Con `default` la barra es la del sistema, con la hora en negro sobre el
       color declarado en `theme-color` (#f3f3f3, el mismo papel), y la página
       empieza justo debajo. Se pierde poder pintar debajo del reloj, que en un
       juego a pantalla completa sería una pena y aquí no: lo que hay ahí arriba
       es el margen de la página. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Estado Decepción" />

  <title>EL MERCIO — Estado de Excepción</title>
</head>
<body>
  <!-- Lienzo del juego -->
  <canvas id="lienzo"></canvas>

  <!-- Capa de interfaz. pointer-events se activa por pantalla, no globalmente,
       para que los swipes lleguen al canvas durante la partida. -->
  <div id="ui"></div>

  <script type="module" src="/src/main.js"></script>

  <!--
    RED DE SEGURIDAD CONTRA LA PANTALLA EN BLANCO
    ---------------------------------------------
    Si el módulo principal no arranca, sin esto la página se queda en blanco
    sin decir por qué. Pasó de verdad: GitHub Pages estaba configurado para
    servir el repositorio en crudo en vez del build, así que este mismo
    archivo se publicaba tal cual y /src/main.js no existía compilado.

    Va inline y sin módulos a propósito: tiene que funcionar precisamente
    cuando lo demás no ha cargado.
  -->
  <script>
    (function () {
      var ESPERA = 8000;

      setTimeout(function () {
        if (window.__arranco) return;

        var enSubcarpeta = location.pathname.replace(/\/[^/]*$/, '/');
        var sirviendoFuente = !!document.querySelector('script[src="/src/main.js"]');

        document.body.innerHTML =
          '<div style="position:fixed;inset:0;display:flex;align-items:center;' +
          'justify-content:center;padding:24px;background:#f3f3f3;color:#141414;' +
          'font-family:system-ui,sans-serif;text-align:center">' +
          '<div style="max-width:460px">' +
          '<div style="font-size:.66rem;letter-spacing:.3em;color:#646464;' +
          'margin-bottom:10px">EL MERCIO</div>' +
          '<h1 style="font-size:2rem;font-weight:900;color:#c53b2b;' +
          'margin-bottom:10px">NO CARGÓ</h1>' +
          '<p style="color:#646464;line-height:1.5;margin-bottom:18px">' +
          (sirviendoFuente
            ? 'El servidor está publicando el código fuente en vez de la ' +
              'versión compilada.'
            : 'El juego no llegó a arrancar.') +
          '</p>' +
          (sirviendoFuente
            ? '<p style="color:#646464;font-size:.78rem;line-height:1.6;' +
              'text-align:left;background:rgba(255,255,255,.04);padding:13px;' +
              'border-radius:10px;border:1px solid rgba(255,255,255,.08)">' +
              'Para quien mantiene el sitio: en GitHub, ' +
              '<b style="color:#ffcf3f">Settings → Pages → Source</b> tiene que ' +
              'estar en <b style="color:#ffcf3f">GitHub Actions</b>, no en ' +
              '“Deploy from a branch”. El workflow de despliegue ya existe y ' +
              'compila correctamente; solo hay que decirle a Pages que use su ' +
              'resultado.</p>'
            : '<button onclick="location.reload()" style="font-family:inherit;' +
              'font-size:.9rem;font-weight:900;letter-spacing:.08em;' +
              'text-transform:uppercase;padding:14px 26px;border:0;' +
              'border-radius:12px;background:#ffcf3f;color:#1a1204;' +
              'cursor:pointer">Reintentar</button>') +
          '<div style="margin-top:16px;font-size:.6rem;color:#2f3746">' +
          enSubcarpeta + '</div>' +
          '</div></div>';
      }, ESPERA);
    })();
  </script>
</body>
</html>
